# Builds the ACE-Step 1.5 GPU image (CUDA base + baked-in weights). Cloned from
# cloudbuild.musicgen.yaml; Dockerfile lands with the acestep-service (Phase 5).
substitutions:
  _AR: ""        # e.g. us-central1-docker.pkg.dev/PROJECT/music-genome
  _TAG: "latest"
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - "build"
      - "-t"
      - "${_AR}/acestep:${_TAG}"
      - "-f"
      - "acestep-service/Dockerfile"
      - "acestep-service"
images:
  - "${_AR}/acestep:${_TAG}"
options:
  diskSizeGb: 200
  machineType: E2_HIGHCPU_8
timeout: 3600s
