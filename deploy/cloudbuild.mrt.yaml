# Builds the Magenta RealTime crossfader image (CUDA + jax + magenta-rt,
# CC-BY-4.0 weights baked). Cloned from cloudbuild.musicgen.yaml; Dockerfile
# lands with mrt-service (Phase 6).
substitutions:
  _AR: ""        # e.g. us-central1-docker.pkg.dev/PROJECT/music-genome
  _TAG: "latest"
steps:
  - name: gcr.io/cloud-builders/docker
    secretEnv: ["HF_TOKEN"]
    env: ["DOCKER_BUILDKIT=1"]   # --mount=type=secret needs BuildKit
    entrypoint: bash
    args:
      - "-c"
      - |
        echo "$$HF_TOKEN" > /tmp/hf_token
        docker build -t ${_AR}/mrt:${_TAG} -f mrt-service/Dockerfile \
          --secret id=hf_token,src=/tmp/hf_token mrt-service
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/HF_TOKEN/versions/latest
      env: HF_TOKEN
images:
  - "${_AR}/mrt:${_TAG}"
options:
  diskSizeGb: 200
  machineType: E2_HIGHCPU_8
timeout: 3600s
